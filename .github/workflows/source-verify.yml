name: Godot source verify

on:
  push:
    branches:
      - asset/quaternius-weapons
    paths:
      - 'dustline-native/**'
      - '.github/workflows/source-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl unzip ffmpeg python3

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          curl -fL --retry 3 "$url" -o /tmp/godot.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Import assets and run source acceptance
        working-directory: dustline-native
        env:
          DUSTLINE_GODOT: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
        run: |
          set -euo pipefail
          bash tools/bootstrap-runtime-assets.sh
